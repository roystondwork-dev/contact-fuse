name: 🐛 Bug report
description: Something in contact-fuse doesn't work as expected.
title: "bug: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste real contacts, email addresses, phone numbers or tokens.**
        Replace them with made-up examples.
        Security vulnerabilities must be reported privately; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect two accounts
        2. Run a scan
        3. ...
    validations:
      required: true
  - type: dropdown
    id: data-impact
    attributes:
      label: Were contacts changed, lost or merged incorrectly?
      options:
        - "No"
        - "Yes, contacts were changed, lost or merged incorrectly"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: contact-fuse version
      placeholder: "0.1.0 (or commit SHA)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "output of `node --version`"
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 140, Safari 26"
  - type: textarea
    id: logs
    attributes:
      label: Logs or run ID
      description: Relevant log output (contact-fuse logs contain no PII, but please double-check) or the merge run ID.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all personal data (contacts, emails, phone numbers, tokens) from this report.
          required: true
